name: backend-regression-gate

on:
  pull_request:
  push:
    branches:
      - mvp-development

permissions:
  contents: read

concurrency:
  group: backend-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: "postgresql+psycopg://ci@localhost:5432/evidence"
      EVIDENCE_ROOT: /tmp/synthetic-evidence-root
      ENVIRONMENT: test
      LOG_LEVEL: WARNING
      INTAKE_MAX_DIRECTORY_ENTRIES: "1000"
      INTAKE_MAX_DIRECTORY_DEPTH: "64"
      INTAKE_MAX_PATHNAME_LENGTH: "4096"
      INTAKE_MAX_PLIST_BYTES: "16777216"
      INTAKE_MAX_SQLITE_MAIN_BYTES: "1073741824"
      INTAKE_MAX_SQLITE_WAL_BYTES: "1073741824"
      INTAKE_MAX_SQLITE_SHM_BYTES: "67108864"
      INTAKE_MAX_CONTROLLED_COPY_BYTES: "2214592512"
      INTAKE_MAX_SCHEMA_ENTRIES: "100000"
      INTAKE_MAX_SQLITE_WORK_UNITS: "100000000"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.13
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install locked environment
        run: |
          python -m pip install --requirement backend/requirements.lock
          python -m pip install --no-deps --no-build-isolation ./backend
      - name: Validate dependency resolution
        run: |
          python backend/scripts/verify_lock.py --project backend/pyproject.toml --lock backend/requirements.lock
          python -m pip check
      - name: Compile application
        run: python -m compileall -q backend/app backend/scripts
      - name: Validate migrations offline
        working-directory: backend
        run: |
          alembic heads
          alembic history
          alembic upgrade head --sql
      - name: Run backend regression suite
        run: python -m pytest backend --basetemp "${{ runner.temp }}/pytest"
      - name: Run legacy characterization suite
        run: python -m unittest discover -s tests
